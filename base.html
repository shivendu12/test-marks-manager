<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Test Marks Manager{% endblock %}</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172033;font:15px system-ui,Arial}.top{background:linear-gradient(120deg,#173b9b,#3478ed);color:white;padding:20px max(16px,calc((100% - 1100px)/2))}.top h1{margin:0}.wrap{max-width:1100px;margin:22px auto;padding:0 14px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.nav a,.btn{padding:10px 14px;border-radius:9px;background:#e5edff;color:#20438d;text-decoration:none;border:0;font-weight:650;cursor:pointer}.nav a:hover,.btn.primary{background:#2457d6;color:white}.box{background:white;border:1px solid #e2e8f0;border-radius:13px;padding:17px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.stat{background:#f1f5ff;padding:14px;border-radius:10px}.stat b{display:block;font-size:24px;color:#2457d6}label{display:block;margin:8px 0 4px;color:#475467;font-size:13px}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}button{font:inherit}.btn{display:inline-block;margin:5px 3px 5px 0}table{border-collapse:collapse;width:100%;min-width:600px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e5eaf2}th{background:#f4f6fa}.scroll{overflow:auto}.msg{padding:10px;background:#e8f8ee;border-radius:8px;margin:8px 0}.error{background:#fff0ed}.muted{color:#667085;font-size:13px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.inline{display:inline}.right{float:right}@media print{.nav,.noprint,.top p{display:none}.wrap{margin:0}.box{border:0}} </style></head><body><header class="top"><h1>📚 Test Marks Manager</h1><p>Online school marks and result management</p></header><main class="wrap">
{% if user.is_authenticated %}<nav class="nav"><a href="{% url 'dashboard' %}">Dashboard</a><a href="{% url 'classes' %}">Classes</a><a href="{% url 'subjects' %}">Subjects</a><a href="{% url 'students' %}">Students</a><a href="{% url 'tests' %}">Tests</a><a href="{% url 'results' %}">Results</a><a href="/django-admin/">Advanced Admin</a><a href="{% url 'logout' %}">Logout</a></nav>{% endif %}
{% for message in messages %}<div class="msg">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}
</main></body></html>
