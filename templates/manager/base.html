
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Test Marks Manager{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f5fa;
            color: #202b45;
        }
        header {
            background: #172554;
            color: white;
            padding: 18px;
            font-size: 21px;
            font-weight: bold;
        }
        .layout { display: flex; min-height: 90vh; }
        nav {
            width: 220px;
            background: #1e293b;
            padding: 20px 12px;
        }
        nav a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 13px;
            margin-bottom: 7px;
            border-radius: 7px;
        }
        nav a:hover { background: #334155; }
        main {
            flex: 1;
            padding: 25px;
            min-width: 0;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 18px;
            box-shadow: 0 2px 10px #0000000d;
        }
        input, select, button {
            padding: 11px;
            margin: 6px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            max-width: 100%;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        th, td {
            padding: 12px;
            border: 1px solid #eee;
            text-align: left;
        }
        th { background: #eaf0ff; }
        .message {
            background: #dcfce7;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 15px;
        }
        @media(max-width:650px) {
            .layout { display: block; }
            nav { width: 100%; }
            nav a { display: inline-block; }
            main { padding: 12px; }
        }
    </style>
</head>
<body>

<header>📚 Test Marks Manager PRO</header>

<div class="layout">

<nav>
    <a href="{% url 'dashboard' %}">🏠 Dashboard</a>
    <a href="{% url 'classes' %}">🏫 Classes</a>
    <a href="{% url 'subjects' %}">📖 Subjects</a>
    <a href="{% url 'students' %}">👨‍🎓 Students</a>
    <a href="{% url 'tests' %}">📝 Tests</a>
    <a href="{% url 'results' %}">📊 Results</a>
    <a href="/django-admin/">⚙️ Admin Panel</a>
    <a href="{% url 'logout' %}">🚪 Logout</a>
</nav>

<main>

    {% if messages %}
        {% for message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}

</main>
</div>

</body>
  </html>
